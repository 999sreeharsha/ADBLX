name: ADBLX
options:
  autogenerateSchemes: false
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  ADBLX:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: ADBLX
        type: syncedFolder
    entitlements:
      path: ADBLX/ADBLX.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ADBLX.shared
    dependencies:
      - target: ADBLXAdsBlocker
        embed: true
      - target: ADBLXPrivacyBlocker
        embed: true
      - target: ADBLXAnnoyancesBlocker
        embed: true
      - target: ADBLXRegionalBlocker
        embed: true
      - target: ADBLXPacketTunnel
        embed: true
      - target: ADBLXSafariWebExtension
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: YES
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphoneos*]": UIStatusBarStyleDefault
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphonesimulator*]": UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        IPHONEOS_DEPLOYMENT_TARGET: "26.5"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "@executable_path/../Frameworks"
        MACOSX_DEPLOYMENT_TARGET: "26.5"
        MARKETING_VERSION: "1.0"
        OTHER_LDFLAGS: "-framework SafariServices"
        PRODUCT_BUNDLE_IDENTIFIER: com.ADBLX.ADBLX
        PRODUCT_NAME: "$(TARGET_NAME)"
        REGISTER_APP_GROUPS: YES
        SDKROOT: auto
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx xros xrsimulator"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2,7"
        XROS_DEPLOYMENT_TARGET: "26.5"
  ADBLXTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: ADBLXTests
        type: syncedFolder
    dependencies:
      - target: ADBLX
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.5"
        MACOSX_DEPLOYMENT_TARGET: "26.5"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.ADBLX.ADBLXTests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SDKROOT: auto
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx xros xrsimulator"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2,7"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ADBLX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ADBLX"
        XROS_DEPLOYMENT_TARGET: "26.5"
  ADBLXUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: ADBLXUITests
        type: syncedFolder
    dependencies:
      - target: ADBLX
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.5"
        MACOSX_DEPLOYMENT_TARGET: "26.5"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.ADBLX.ADBLXUITests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SDKROOT: auto
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx xros xrsimulator"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2,7"
        TEST_TARGET_NAME: ADBLX
        XROS_DEPLOYMENT_TARGET: "26.5"
  ADBLXAdsBlocker:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: Extensions/ADBLXAdsBlocker
        type: syncedFolder
    info:
      path: Extensions/ADBLXAdsBlocker/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    entitlements:
      path: Extensions/ADBLXAdsBlocker/ADBLXAdsBlocker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ADBLX.shared
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.5"
        MACOSX_DEPLOYMENT_TARGET: "26.5"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.ADBLX.ADBLX.AdsBlocker
        PRODUCT_NAME: "$(TARGET_NAME)"
        REGISTER_APP_GROUPS: YES
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx xros xrsimulator"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2,7"
        XROS_DEPLOYMENT_TARGET: "26.5"
  ADBLXPrivacyBlocker:
    type: app-extension
    platform: auto
