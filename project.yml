schemes:
  ADBLX:
    build:
      targets:
        ADBLX: all
        ADBLXAdsBlocker: [build]
        ADBLXPrivacyBlocker: [build]
        ADBLXAnnoyancesBlocker: [build]
        ADBLXRegionalBlocker: [build]
        ADBLXPacketTunnel: [build]
        ADBLXSafariWebExtension: [build]
    test:
      targets:
        - ADBLXTests
        - ADBLXUITests
      config: Debug
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
