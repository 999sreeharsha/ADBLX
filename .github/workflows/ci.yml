name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Safari web extension JS tests
        run: node --test "Extensions/ADBLXSafariWebExtension/Tests/*.test.js"

      - name: Test the archive's report recipient check
        run: Scripts/check-report-recipient.test.sh

      - name: Test the archive's manifest trust check
        run: Scripts/check-manifest-trust.test.sh

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify no generated-file drift
        # Whole repository, not just the project: XcodeGen also writes the
        # .entitlements and Info.plist files, which must never be hand-edited.
        run: git diff --exit-code

      - name: Verify AppGroup.swift is byte-identical across all targets
        run: |
          REFERENCE="ADBLX/AppGroup.swift"
          for FILE in \
            "Extensions/ADBLXAdsBlocker/AppGroup.swift" \
            "Extensions/ADBLXPrivacyBlocker/AppGroup.swift" \
            "Extensions/ADBLXAnnoyancesBlocker/AppGroup.swift" \
            "Extensions/ADBLXRegionalBlocker/AppGroup.swift"; do
            if ! cmp -s "$REFERENCE" "$FILE"; then
              echo "::error::$FILE differs from $REFERENCE — AppGroup.swift must stay byte-identical across all targets until ADR-0003 lands (see docs/ADR)."
              exit 1
            fi
          done
          echo "All five AppGroup.swift copies are byte-identical."

      - name: Find an available iOS Simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"])
                      sys.exit(0)
          ')
          if [ -z "$UDID" ]; then
            echo "No iOS Simulator found" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild -project ADBLX.xcodeproj -scheme ADBLX \
            -destination "id=${{ steps.simulator.outputs.udid }}" build

      - name: Run unit tests (ADBLXTests only)
        run: |
          xcodebuild -project ADBLX.xcodeproj -scheme ADBLX \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:ADBLXTests test
