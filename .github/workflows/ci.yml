name: CI

# Manual runs only (Actions tab, "Run workflow"): a push or pull request no longer starts a paid
# macOS run. The release checks run on every archive in Xcode instead (Scripts/check-archive-release.sh).
# To turn CI back on, restore the push and pull_request triggers for dev and main.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Xcode 27 is only on its own image (arm64): macos-26 and macos-latest stop at Xcode 26.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Safari web extension JS tests
        run: node --test "Extensions/ADBLXSafariWebExtension/Tests/*.test.js"

      - name: Test the archive's report recipient check
        run: Scripts/check-report-recipient.test.sh

      - name: Test the archive's manifest trust check
        run: Scripts/check-manifest-trust.test.sh

      - name: Test the Release extension version check
        run: Scripts/check-extension-versions.test.sh

      - name: Test the Release build's background modes check
        run: Scripts/check-background-modes.test.sh

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # The image defaults to 27.1; pin the version the project is developed on.
          xcode-version: '27.2'

      - name: Install XcodeGen
        # Exactly the version project.yml requires (options.minimumXcodeGenVersion), not
        # Homebrew's latest: another version can generate a different project and fail the
        # drift check below. The checksum is the one GitHub publishes for the release asset.
        env:
          XCODEGEN_VERSION: "2.48.0"
          XCODEGEN_SHA256: "620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version | grep -qx "Version: ${XCODEGEN_VERSION}"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify no generated-file drift
        # Whole repository, not just the project: XcodeGen also writes the
        # .entitlements and Info.plist files, which must never be hand-edited.
        run: git diff --exit-code

      - name: Verify AppGroup.swift is byte-identical across all targets
        run: |
          REFERENCE="ADBLX/AppGroup.swift"
          for FILE in \
            "Extensions/ADBLXAdsBlocker/AppGroup.swift" \
            "Extensions/ADBLXPrivacyBlocker/AppGroup.swift" \
            "Extensions/ADBLXAnnoyancesBlocker/AppGroup.swift" \
            "Extensions/ADBLXRegionalBlocker/AppGroup.swift"; do
            if ! cmp -s "$REFERENCE" "$FILE"; then
              echo "::error::$FILE differs from $REFERENCE — AppGroup.swift must stay byte-identical across all targets until ADR-0003 lands (see docs/ADR)."
              exit 1
            fi
          done
          echo "All five AppGroup.swift copies are byte-identical."

      - name: Find an available iOS Simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"])
                      sys.exit(0)
          ')
          if [ -z "$UDID" ]; then
            echo "No iOS Simulator found" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild -project ADBLX.xcodeproj -scheme ADBLX \
            -destination "id=${{ steps.simulator.outputs.udid }}" build

      - name: Release build has no DNS Protection, and its extensions match the app's version
        run: |
          xcodebuild -project ADBLX.xcodeproj -scheme ADBLX -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/release \
            CODE_SIGNING_ALLOWED=NO build
          Scripts/check-release-no-dns.sh build/release/Build/Products/Release-iphoneos/ADBLX.app
          Scripts/check-extension-versions.sh build/release/Build/Products/Release-iphoneos/ADBLX.app
          # ADR-0014: the merged plist's background keys, and no DEBUG timing spike.
          Scripts/check-background-modes.sh build/release/Build/Products/Release-iphoneos/ADBLX.app

      - name: Run unit tests (ADBLXTests only)
        run: |
          xcodebuild -project ADBLX.xcodeproj -scheme ADBLX \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:ADBLXTests test
