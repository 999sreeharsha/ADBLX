included:
  - ADBLX

excluded:
  - Pods
  - DerivedData
  - .build
  - ADBLXTests
  - ADBLXUITests
  - Extensions
  - "**/Preview Content"
  - "**/*.generated.swift"

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - force_unwrapping
  - unused_import

line_length:
  warning: 120
  error: 150

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

custom_rules:
  no_hardcoded_ui_string:
    included: ".*\\.swift"
    regex: '(Text|Label|Button)\(\s*"[A-Z][^"]*"'
    message: "User-visible strings must use a Localizable.xcstrings key (e.g. \"home.title\"), not a hardcoded literal. See docs/coding-standards.md."
    severity: error
